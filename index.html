      <select id="fLoc" style="width:auto;"><option value="all">All locations</option>${locations.map(l => opt(l.id, l.name, assetLocFilter)).join('')}</select>
      <select id="fType" style="width:auto;"><option value="all">All types</option>${types.map(t => opt(t, t, assetTypeFilter)).join('')}</select>
      <select id="fStatus" style="width:auto;"><option value="all">All statuses</option>${ASSET_STATUSES.map(x => opt(x, x, assetStatusFilter)).join('')}</select>
      <span class="ticket-meta" id="assetCount" style="margin-left:auto;"></span>
      <button class="btn-ghost" id="assetImport" title="Add many assets from a filled Excel sheet">⬆ Import Excel</button>
      <button class="btn-ghost" id="assetTpl" title="Blank sheet in the import format">⬇ Template</button>
      <button class="btn-ghost" id="assetXlsx">⬇ Excel report</button>
      <input type="file" id="assetFile" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;"><table class="tbl">
      <thead><tr><th>Asset</th><th>Type</th><th>Location</th><th>Assigned to</th><th>Serial / tag</th><th>Condition</th><th>Status</th><th></th></tr></thead>
      <tbody id="assetRows"></tbody>
    </table></div>
  `;
  const bindF = (id, set) => { const el = document.getElementById(id); el.onchange = e => { set(e.target.value); renderAssetsTab(); }; };
  bindF('fLoc', v => assetLocFilter = v); bindF('fType', v => assetTypeFilter = v); bindF('fStatus', v => assetStatusFilter = v);

  const exBox = document.getElementById('a_extra'), typeSel = document.getElementById('a_type');
  extraBind(exBox);
  const renderEx = () => { exBox.innerHTML = extraHtml(assetKind(typeSel.value), null); };
  typeSel.onchange = renderEx; renderEx();
  const addBtn = document.getElementById('addAssetBtn');
  const addLabel = addBtn.innerHTML;
  addBtn.onclick = async () => {
    const msg = document.getElementById('a_msg');
    const err = t => { msg.style.color = 'var(--danger)'; msg.textContent = t; };
    msg.textContent = '';
    const name = document.getElementById('a_name').value.trim();
    if (!name) return err('Asset name is required.');
    // `locations` is already limited to the signed-in user's own locations
    const loc = locations.find(l => l.id === document.getElementById('a_loc').value);
    if (!loc) return err(isAdmin() ? 'Add a location first.' : 'No location is assigned to your account — ask an admin.');
    const id = 'asset_' + Date.now().toString(36);
    const person = document.getElementById('a_person').value.trim();
    const by = isAdmin() ? '' : (SESSION.name || '');
    addBtn.disabled = true; addBtn.textContent = 'Saving…';
    let doc, plan, bad = 0;
    try {
      doc = {
        id, name, type: document.getElementById('a_type').value,
        locationId: loc.id, locationName: loc.name,
        serial: document.getElementById('a_serial').value.trim(),
        model: document.getElementById('a_model').value.trim(), purchaseDate: document.getElementById('a_pdate').value,
        warrantyUntil: document.getElementById('a_warr').value, notes: document.getElementById('a_notes').value.trim(),
        status: document.getElementById('a_status').value, createdAt: Date.now(),
        condition: document.getElementById('a_cond').value, assignedTo: person,
        history: [{type:'created', at: Date.now(), by, note: '', person}]
      };
      const ex = extraCollect(exBox); doc.specs = ex.specs;
      await db.doc('assets/' + id).set(doc);
      plan = planChildren(doc, ex, []);
      if (plan.items.length) bad = await writeChildren(doc, plan, by);
    } catch(e){
      addBtn.disabled = false; addBtn.innerHTML = addLabel;
      return err("Couldn't save — check your connection and try again.");
    }
    await renderAssetsTab();
    if (bad) alert(bad + ' accessory record(s) could not be saved. Open the asset and press Edit → Save to retry.');
    if (plan.items.length) showQrSheet([doc, ...plan.items].map(x => ({url: assetUrl(x.id), title: x.name, sub: x.id === id ? loc.name : x.type, short: x.id === id ? x.name : (x.label || x.type), line2: x.id === id ? loc.name : name})), name + ' — QR labels');
    else showQr(assetUrl(id), name, loc.name);
  };

  const fileIn = document.getElementById('assetFile');
  document.getElementById('assetImport').onclick = () => fileIn.click();
  fileIn.onchange = () => { const f = fileIn.files[0]; fileIn.value = ''; if (f) openAssetImport(f, assets, locations, renderAssetsTab); };
  document.getElementById('assetTpl').onclick = async e => { const b = e.currentTarget; b.disabled = true; try { await downloadAssetTemplate(locations); } finally { b.disabled = false; } };

  const hasFilter = assetLocFilter !== 'all' || assetTypeFilter !== 'all' || assetStatusFilter !== 'all';
  const match = x => (assetLocFilter === 'all' || x.locationId === assetLocFilter) && (assetTypeFilter === 'all' || x.type === assetTypeFilter) && (assetStatusFilter === 'all' || x.status === assetStatusFilter);
  const tops = assets.filter(x => !isChildAsset(x, assets));
  const kidsMap = new Map(tops.map(t => [t.id, descendantsOf(assets, t.id)]));
  const shown = [];
  tops.slice().sort((x,y) => (x.name||'').localeCompare(y.name||'')).forEach(t => {
    const kids = kidsMap.get(t.id) || [];
    const vis = hasFilter ? kids.filter(r => match(r.k)).map(r => ({k: r.k, d: 0})) : kids;
    if (match(t) || vis.length) shown.push({t, kids, vis});
  });
  const nKids = assets.length - tops.length;
  document.getElementById('assetCount').textContent = shown.length + ' of ' + tops.length + ' asset' + (tops.length === 1 ? '' : 's') + (nKids ? ' · ' + nKids + ' accessories / cameras' : '');
  document.getElementById('assetXlsx').onclick = async e => { const b = e.currentTarget; b.disabled = true; b.textContent = 'Preparing…'; try { await exportAssetsXlsx(shown.map(x => x.t), assets); } finally { b.disabled = false; b.textContent = '⬇ Excel report'; } };
  const stCls = x => x === 'Active' ? 'badge-resolved' : (x === 'In Repair' ? 'badge-in-progress' : 'badge-open');
  const statusCell = a => isAdmin() ? `<select class="status-select" data-id="${a.id}" style="margin:0;padding:5px 8px;">${ASSET_STATUSES.map(x => `<option value="${x}" ${a.status===x?'selected':''}>${x}</option>`).join('')}</select>` : `<span class="badge ${stCls(a.status||'Active')}">${escapeHtml(a.status||'Active')}</span>`;
  const btns = (a, extra) => `<td style="text-align:right;white-space:nowrap;">${extra || ''}<button class="btn-ghost edit-btn" data-id="${a.id}" style="padding:6px 11px;font-size:.78rem;">Edit</button>
        <button class="btn-ghost qr-btn" data-id="${a.id}" style="padding:6px 11px;font-size:.78rem;">QR</button>
        ${isAdmin() ? `<a class="btn-ghost" href="${escapeHtml(assetUrl(a.id))}" target="_blank" style="padding:6px 11px;font-size:.78rem;">Open</a>` : ''}</td>`;
  const parentRow = ({t, kids, vis}) => {
    const open = hasFilter ? vis.length > 0 : assetOpen.has(t.id);
    return `<tr>
      <td>${kids.length ? `<button class="link-btn tg" data-id="${t.id}" style="margin-right:6px;">${open ? '▾' : '▸'}</button>` : ''}<b>${escapeHtml(t.name)}</b>${t.model ? `<div class="ticket-meta" style="margin:2px 0 0;">${escapeHtml(t.model)}</div>` : ''}${extraSummary(t, kids.map(r => r.k))}</td>
      <td>${escapeHtml(t.type||'—')}</td><td>${escapeHtml(t.locationName||t.locationId||'—')}</td><td>${escapeHtml(t.assignedTo||'—')}</td><td>${escapeHtml(t.serial||'—')}</td>
      <td><span class="badge ${condBadge(t.condition||'Good')}">${escapeHtml(t.condition||'Good')}</span></td><td>${statusCell(t)}</td>
      ${btns(t, kids.length ? `<button class="btn-ghost qrset-btn" data-id="${t.id}" style="padding:6px 11px;font-size:.78rem;" title="Print every QR of this asset">QR set</button> ` : '')}</tr>${open ? vis.map(r => childRow(r)).join('') : ''}`;
  };
  const childRow = ({k, d}) => `<tr style="background:var(--field);">
      <td style="padding-left:${22 + d * 18}px;">↳ <b>${escapeHtml(k.label || k.name)}</b><div class="ticket-meta" style="margin:2px 0 0;">${[k.model, k.floor ? 'Floor: ' + k.floor : '', k.type === 'DVR' ? (k.cameraCount || 0) + ' cameras' : ''].filter(Boolean).map(escapeHtml).join(' · ')}</div></td>
      <td>${escapeHtml(k.type||'—')}</td><td>${escapeHtml(k.locationName||'—')}</td><td>${escapeHtml(k.assignedTo||'—')}</td><td>${escapeHtml(k.serial||'—')}</td>
      <td><span class="badge ${condBadge(k.condition||'Good')}">${escapeHtml(k.condition||'Good')}</span></td><td>${statusCell(k)}</td>${btns(k)}</tr>`;
  const tb = document.getElementById('assetRows');
  tb.innerHTML = shown.length ? shown.map(parentRow).join('') : `<tr><td colspan="8" class="ticket-meta" style="text-align:center;padding:30px;">${assets.length ? 'No assets match these filters.' : 'No assets recorded yet.'}</td></tr>`;
  tb.querySelectorAll('.tg').forEach(b => b.onclick = () => { assetOpen.has(b.dataset.id) ? assetOpen.delete(b.dataset.id) : assetOpen.add(b.dataset.id); renderAssetsTab(); });
  tb.querySelectorAll('.qr-btn').forEach(b => b.onclick = () => {
    const a = assets.find(x => x.id === b.dataset.id);
    showQr(assetUrl(a.id), a.name, (a.type || '') + ' · ' + (a.serial || a.id));
  });
  tb.querySelectorAll('.qrset-btn').forEach(b => b.onclick = () => {
    const a = assets.find(x => x.id === b.dataset.id), list = [a, ...descendantsOf(assets, a.id).map(r => r.k)];
    showQrSheet(list.map(x => ({url: assetUrl(x.id), title: x.name, sub: x.id === a.id ? (x.locationName || '') : x.type, short: x.id === a.id ? x.name : (x.label || x.type), line2: x.id === a.id ? (x.locationName || '') : a.name})), a.name + ' — QR labels');
  });
  tb.querySelectorAll('.edit-btn').forEach(b => b.onclick = () => openAssetEditor(assets.find(x => x.id === b.dataset.id), locations, renderAssetsTab, assets));
  tb.querySelectorAll('.status-select').forEach(sel => sel.onchange = async () => {
    sel.disabled = true;
    try { await db.doc('assets/' + sel.dataset.id).update({status: sel.value}); }
    finally { renderAssetsTab(); }
  });
}

function showQr(url = formUrl(), title = 'IT Issue Report Form', sub = ''){
  const bg = document.createElement('div');
  bg.className = 'qr-modal-bg';
  bg.innerHTML = `
    <div class="qr-modal">
      <h1 style="font-size:1.1rem;">${escapeHtml(title)}</h1>
      ${sub ? `<div class="ticket-meta" style="margin:-4px 0 12px;">${escapeHtml(sub)}</div>` : ''}
      <div id="qrCanvas"></div>
      <div class="url">${escapeHtml(url)}</div>
      <button class="link-btn" id="copyUrl">Copy link</button>
      <br><br>
      <button class="btn-ghost" id="printQr">Print label (30.2 × 20 mm)</button> <button class="btn-ghost" id="closeModal">Close</button>
    </div>
  `;
  document.body.appendChild(bg);
  const qrTarget = document.getElementById('qrCanvas');
  if (window.QRCode) {
    try {
      new QRCode(qrTarget, {text: url, width: 220, height: 220, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M});
    } catch(e) {
      qrTarget.innerHTML = '<div style="color:var(--danger);font-size:.8rem;">Could not render QR code. Use the link below instead.</div>';
    }
  } else {
    qrTarget.innerHTML = '<div style="color:var(--danger);font-size:.8rem;">QR library failed to load. Use the link below instead.</div>';
  }
  document.getElementById('printQr').onclick = () => printLabels([{url, short: title, line2: sub}], +(lsGet('it_label_gap') || 2));
  document.getElementById('closeModal').onclick = () => bg.remove();
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.getElementById('copyUrl').onclick = () => {
    navigator.clipboard.writeText(url).then(()=>{ document.getElementById('copyUrl').textContent = 'Copied!'; });
  };
}

// ---------- LABEL PRINTING: 30.2 mm x 20 mm stickers, 3 across ----------
const LABEL = {w: 30.2, h: 20, cols: 3};
function qrPng(url){   // large, low-density QR so it stays sharp on a small thermal label
  const d = document.createElement('div');
  try { new QRCode(d, {text: url, width: 360, height: 360, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.L}); } catch(e){ return ''; }
  const c = d.querySelector('canvas'), im = d.querySelector('img');
  return c ? c.toDataURL() : (im ? im.src : '');
}
// items: [{url, short, line2}] -> opens a print window, one row of 3 labels per 'page' (page = 3 x 30.2 mm wide, 20 mm tall)
function printLabels(items, gap){
  gap = Math.max(0, +gap || 0);
  const W = +(LABEL.w * LABEL.cols + gap * (LABEL.cols - 1)).toFixed(2);
  const cell = it => `<div class="l"><img src="${qrPng(it.url)}"><div class="t"><b>${escapeHtml(it.short || it.title || '')}</b><span>${escapeHtml(it.line2 || it.sub || '')}</span></div></div>`;
  let rows = '';
  for (let i = 0; i < items.length; i += LABEL.cols) rows += `<div class="r">${items.slice(i, i + LABEL.cols).map(cell).join('')}</div>`;
  const w = window.open('', '_blank'); if (!w) { alert('Allow pop-ups to print the labels.'); return; }
  w.document.write(`<title>QR labels</title><style>
    @page{size:${W}mm ${LABEL.h}mm;margin:0}
    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#000}
    .r{display:flex;gap:${gap}mm;width:${W}mm;height:${LABEL.h}mm;page-break-after:always;break-after:page;overflow:hidden}
    .r:last-child{page-break-after:auto;break-after:auto}
    .l{width:${LABEL.w}mm;height:${LABEL.h}mm;flex:none;display:flex;align-items:center;gap:1mm;padding:1.4mm;overflow:hidden}
    .l img{width:15.8mm;height:15.8mm;flex:none;image-rendering:pixelated}
    .t{display:flex;flex-direction:column;min-width:0;line-height:1.12}
    .t b{font-size:5.5pt;word-break:break-word;max-height:11mm;overflow:hidden}
    .t span{font-size:4.5pt;margin-top:.6mm;word-break:break-word;max-height:6mm;overflow:hidden}
    @media screen{body{padding:8px;background:#ddd}.r{margin-bottom:6px;background:#fff}}
  </style>${rows}<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>`);
  w.document.close();
}

// ---------- STOCK TAKE (annual asset verification by QR scan) ----------
let STOCK = {enabled:false, title:'', startDate:'', endDate:'', takeId:''};
const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '';
function stockOpen(){ const t = todayStr(); return !!(STOCK.enabled && STOCK.startDate && t >= STOCK.startDate && t <= (STOCK.endDate || STOCK.startDate)); }
async function loadStock(){
  try { const r = await db.doc('settings/stocktake').get(); STOCK = Object.assign({enabled:false, title:'', startDate:'', endDate:'', takeId:''}, (r && r.data) || {}); } catch(e){}
}
function stockBanner(){
  if (!STOCK.enabled || !STOCK.startDate) return '';
  const end = STOCK.endDate || STOCK.startDate, t = todayStr();
  if (t > end) return '';
  const when = fmtDate(STOCK.startDate) + (end !== STOCK.startDate ? ' – ' + fmtDate(end) : '');
  return `<div class="banner">${stockOpen() ? `📋 ${escapeHtml(STOCK.title || 'Stock take')} is open now (${when}). Open the Stock take tab to scan your assets.` : `📋 ${escapeHtml(STOCK.title || 'Annual stock take')} is scheduled for ${when}.`}</div>`;
}

let scanStream = null, scanRaf = 0, scanBusy = false, scanKeyHandler = null;
function stopCamera(){ cancelAnimationFrame(scanRaf); scanBusy = false; if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; } }
function stopScan(){ stopCamera(); if (scanKeyHandler) { document.removeEventListener('keydown', scanKeyHandler, true); scanKeyHandler = null; } }
// Reads QR codes AND 1-D/2-D barcodes (Code 128/39, EAN, UPC, ITF, Codabar, Data Matrix).
// Uses the browser's BarcodeDetector when present, otherwise jsQR + ZXing as a fallback (iPhone/Safari, Firefox).
async function startScan(video, onCode){
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) throw new Error('Camera access needs a secure (HTTPS) page and a supported browser.');
  stopCamera();
  const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
  if (!video.isConnected) { stream.getTracks().forEach(t => t.stop()); return false; }
  scanStream = stream;
  video.srcObject = stream; video.setAttribute('playsinline', ''); await video.play();
  let det = null, zx = null;
  if ('BarcodeDetector' in window) {
    try {
      const want = ['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar','data_matrix'];
      const sup = BarcodeDetector.getSupportedFormats ? await BarcodeDetector.getSupportedFormats() : want;
      const fm = want.filter(f => sup.includes(f));
      if (fm.length) det = new BarcodeDetector({formats:fm});
    } catch(e){}
  }
  if (!det) {
    if (!window.jsQR) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js');
    if (!window.ZXing) await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
    if (window.ZXing) {
      try {
        const Z = window.ZXing, hints = new Map(), F = Z.BarcodeFormat;
        hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.QR_CODE, F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.DATA_MATRIX]);
        hints.set(Z.DecodeHintType.TRY_HARDER, true);
        zx = new Z.MultiFormatReader(); zx.setHints(hints);
      } catch(e){}
    }
  }
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
  let last = 0;
  const tick = async ts => {
    if (!video.isConnected || !scanStream) { stopCamera(); return; }
    scanRaf = requestAnimationFrame(tick);
    if (scanBusy || ts - last < 180 || video.readyState < 2) return;
    last = ts; scanBusy = true;
    try {
      let text = '';
      if (det) { const r = await det.detect(video); if (r.length) text = r[0].rawValue; }
      else if (video.videoWidth) {
        const k = Math.min(1, 960 / video.videoWidth);
        cv.width = Math.round(video.videoWidth * k); cv.height = Math.round(video.videoHeight * k);
        cx.drawImage(video, 0, 0, cv.width, cv.height);
        if (window.jsQR) { const c = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height); if (c) text = c.data; }
        if (!text && zx) {
          try { const Z = window.ZXing; text = zx.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)))).getText(); }
          catch(e){ /* nothing readable in this frame */ }
        }
      }
      if (text) onCode(text);
    } catch(e){}
    scanBusy = false;
  };
  scanRaf = requestAnimationFrame(tick);
  return true;
}

      if (!startDate) { msg.style.color = 'var(--danger)'; msg.textContent = 'Choose a start date.'; return; }
      if (endDate && endDate < startDate) { msg.style.color = 'var(--danger)'; msg.textContent = 'End date is before the start date.'; return; }
      try {
        await db.doc('settings/stocktake').set({enabled:true, title:$('sk_title').value.trim(), startDate, endDate, takeId:'st_' + startDate, announcedAt:Date.now()});
        await loadStock(); renderAdmin();
      } catch(e){ msg.style.color = 'var(--danger)'; msg.textContent = "Couldn't save — check your connection."; }
    };
    if ($('sk_off')) $('sk_off').onclick = async () => { try { await db.doc('settings/stocktake').set({enabled:false}); await loadStock(); renderAdmin(); } catch(e){} };
  }
  if (!$('stVideo')) return;

  const show = html => { $('stResult').innerHTML = html; };
  const idFromCode = text => { text = String(text).trim(); try { const u = new URL(text); return u.searchParams.get('id') || text; } catch(e){ return text; } };
  const findAsset = code => { const id = idFromCode(code), low = id.toLowerCase(); return assets.find(a => a.id === id) || assets.find(a => a.serial && String(a.serial).toLowerCase() === low); };
  const IDLE = '<div class="empty">Scan an asset barcode or QR code to confirm it is available.</div>';
  let actx = null;
  const beep = ok => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 880 : 220; g.gain.value = .08; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? .12 : .28)); } catch(e){} };
  let autoOn = true; try { autoOn = localStorage.getItem('stAutoMark') !== '0'; } catch(e){}
  $('stAuto').checked = autoOn;
  $('stAuto').onchange = e => { autoOn = e.target.checked; try { localStorage.setItem('stAutoMark', autoOn ? '1' : '0'); } catch(_){} };
  const refocus = () => { if (window.matchMedia && matchMedia('(pointer:fine)').matches && $('stManual')) $('stManual').focus(); };
  const record = async (a, condition) => {
    const rec = {id:STOCK.takeId + '_' + a.id, takeId:STOCK.takeId, assetId:a.id, assetName:a.name, assetType:a.type||'', serial:a.serial||'', locationId:a.locationId||'', locationName:a.locationName||'',
      status:'available', condition, by:SESSION.name || 'Admin', at:Date.now()};
    await db.doc('stockscans/' + rec.id).set(rec); scans[a.id] = rec; try { drawProgress(); } catch(_){} return rec;
  };
  const why = e => { const c = (e && (e.code || e.name)) || '', m = (e && e.message) || '';
    if (/permission/i.test(c + m)) return 'Permission denied by Firestore rules for the "stockscans" collection.';
    if (/unavailable|network|offline/i.test(c + m)) return 'No connection to the database (' + (c || m) + ').';
    return (c ? c + ': ' : '') + m.slice(0, 140) || 'Unknown error.'; };
  const info = a => `<div style="font-size:1.25rem;font-weight:600;">${escapeHtml(a.name)}</div>
      <div class="ticket-meta">${escapeHtml([a.type, a.model, a.serial].filter(Boolean).join(' · '))}</div>
      <div class="ticket-meta">${escapeHtml(a.locationName || '—')}${a.assignedTo ? ' · ' + escapeHtml(a.assignedTo) : ''}</div>`;
  const autoMark = async (a, s) => {
    if (s) { beep(true); show(`${info(a)}<div class="ticket-meta" style="color:var(--ok);font-weight:600;">Already confirmed by ${escapeHtml(s.by||'')} ${timeAgo(s.at)}</div>`); return; }

    catch(e){ console.error('stock scan save failed', e); beep(false); show(`${info(a)}<div class="ticket-meta" style="color:var(--danger);">Couldn't save — ${escapeHtml(why(e))}</div>`); lastCode = ''; }
    hold = false;
  };
  let lastCode = '', lastAt = 0;
  const handle = code => {
    code = String(code).trim(); if (!code) return;
    const now = Date.now(); if (code === lastCode && now - lastAt < 2500) { lastAt = now; return; }   // same code still in view
    lastCode = code; lastAt = now;
    if (hold) return; const a = findAsset(code);
    if (!a) { beep(false); show(`<div class="empty" style="color:var(--danger)">That code isn't an asset in ${admin ? 'the system' : 'your locations'}.<div class="ticket-meta">${escapeHtml(code.slice(0, 80))}</div></div>`); return; }
    if (navigator.vibrate) navigator.vibrate(60);
    const s = scans[a.id];

    hold = true; current = a;
    show(`${info(a)}
      ${s ? `<div class="ticket-meta" style="color:var(--ok);font-weight:600;">Already confirmed by ${escapeHtml(s.by||'')} ${timeAgo(s.at)}</div>` : ''}

    $('st_no').onclick = () => { hold = false; current = null; lastCode = ''; show(IDLE); };
    $('st_ok').onclick = async () => {
      $('st_ok').disabled = true; $('st_ok').textContent = 'Saving…';
      try { await record(a, $('st_cond').value); hold = false; current = null; beep(true);
        show(`<div class="empty" style="color:var(--ok);font-weight:600;">✓ ${escapeHtml(a.name)} marked available</div>`); }
      catch(e){ $('st_ok').disabled = false; $('st_ok').textContent = 'Mark available'; $('st_msg').style.color = 'var(--danger)'; $('st_msg').textContent = "Couldn't save — " + why(e); console.error('stock scan save failed', e); }
    };
  };

  // Camera: starts by itself when the tab opens; the button just turns it off/on.
  let camOn = false;
  const startCam = async () => {
    try {
      $('stHint').style.display = ''; $('stHint').textContent = 'Starting camera…';
      const ok = await startScan($('stVideo'), handle); if (!ok) return;
      camOn = true; $('stCam').textContent = 'Stop camera'; $('stHint').style.display = 'none';
    } catch(e){
      camOn = false; $('stCam').textContent = 'Start camera'; $('stHint').style.display = '';
      $('stHint').textContent = (e && e.name === 'NotAllowedError') ? 'Camera permission was denied. Allow it in the browser settings, or use a handheld scanner / type the ID below.' : (e.message || 'Could not start the camera.');
    }
  };
  const stopCam = () => { stopCamera(); camOn = false; $('stCam').textContent = 'Start camera'; $('stHint').style.display = ''; $('stHint').textContent = 'Camera is off'; };
  $('stCam').onclick = () => camOn ? stopCam() : startCam();

  // Handheld USB / Bluetooth scanners type the code very fast and finish with Enter — catch it wherever the focus is.
  let buf = '', lastKey = 0;
  scanKeyHandler = e => {
    const t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') { if (buf.length >= 3) { e.preventDefault(); handle(buf); } buf = ''; return; }
    if (e.key.length !== 1) return;
    const now = performance.now(); if (now - lastKey > 100) buf = '';
    buf += e.key; lastKey = now;
  };
  document.addEventListener('keydown', scanKeyHandler, true);

  const manual = () => { const v = $('stManual').value.trim(); if (v) { handle(v); $('stManual').value = ''; refocus(); } };
  $('stFind').onclick = manual; $('stManual').onkeydown = e => { if (e.key === 'Enter') manual(); };
  refocus();
  startCam();
}

// ---------- ASSET PAGE (opened by scanning the QR label) ----------
const CONDITIONS = ["New","Good","Fair","Poor","Damaged"];
const condBadge = c => ({New:'badge-resolved',Good:'badge-resolved',Fair:'badge-in-progress'}[c] || 'badge-open');
function assetUrl(id){ return pageBaseUrl() + '?view=asset&id=' + encodeURIComponent(id); }

// ---------- REPAIR PRIORITY: worked out from the asset itself, never picked by hand ----------
// score 0-3 maps to URGENCY = Low, Medium, High, Critical (and URGENCY_HOURS gives the fix-by time)
const TYPE_BASE = {'pos terminal':2, 'router/switch':2, laptop:1, desktop:1, printer:1, 'phone/tablet':1, monitor:0, other:0};
function typeBase(type){
  const t = (type || '').toLowerCase();
  if (t in TYPE_BASE) return TYPE_BASE[t];
  if (/pos|till|router|switch|server|firewall|network|wi-?fi|access point/.test(t)) return 2;  // custom types
  return 1;
}
function repairPriority(a, tickets){
  const type = a.type || 'Asset';
  const base = typeBase(a.type);
  let score = base;
  const reasons = [base === 2 ? type + ' is business-critical' : base === 1 ? type + ' is a standard work device' : type + ' is low-impact'];
  if ((a.condition || 'Good') === 'Damaged') { score += 1; reasons.push('condition is Damaged'); }
  const open = tickets.filter(t => t.assetId === a.id && t.status !== 'resolved');
  if (open.length) {
    score += 1; reasons.push(open.length + ' open ticket' + (open.length === 1 ? '' : 's'));
    const worst = Math.max(...open.map(t => URGENCY.indexOf(t.urgency)));   // an open High/Critical ticket sets a floor
    if (worst > score) { score = worst; reasons.push('open ' + URGENCY[worst] + ' ticket'); }
  }
  score = Math.max(0, Math.min(URGENCY.length - 1, score));
  const level = URGENCY[score], hours = URGENCY_HOURS[level];
  return {level, hours, reasons, dueBy: Date.now() + hours * 3600000};
}
const prioBadge = p => ({Critical:'badge-open', High:'badge-open', Medium:'badge-in-progress'}[p] || 'badge-resolved');
const fmtHours = h => h < 48 ? h + ' hours' : Math.round(h / 24) + ' days';

async function assetAdminSignIn(user, pw){
  const r = await db.doc('settings/auth').get(); const cred = r && r.data;
  if (!cred) throw new Error('The admin login has not been set up yet — open the admin dashboard first.');
  if (user.toLowerCase() !== (cred.user || '').toLowerCase()) return false;
  return (await hashPw(cred.user, pw, cred.salt)) === cred.hash;
}

    </div>`;

  if ($('qrSet')) $('qrSet').onclick = () => showQrSheet([a, ...descendantsOf(allA, a.id).map(r => r.k)].map(x => ({url: assetUrl(x.id), title: x.name, sub: x.id === a.id ? (x.locationName || '') : x.type, short: x.id === a.id ? x.name : (x.label || x.type), line2: x.id === a.id ? (x.locationName || '') : a.name})), a.name + ' — QR labels');
  app.querySelectorAll('.kqr').forEach(b => b.onclick = () => { const k = allA.find(x => x.id === b.dataset.id); if (k) showQr(assetUrl(k.id), k.name, k.type); });
  const prio = repairPriority(a, tickets);
  const forms = {
    repair: () => `<label>Repair status</label><select id="p_outcome"><option value="started">Sent / repair started</option><option value="completed">Repair completed</option></select>
      <div id="p_prio" class="ticket-meta" style="background:var(--bg);border-radius:var(--radius-sm);padding:11px 13px;margin:14px 0 0;line-height:1.7;">
        <b>Repair priority</b> <span class="badge ${prioBadge(prio.level)}">${prio.level}</span><br>
        Fix within ${fmtHours(prio.hours)} · set automatically from this asset<br>
        Based on: ${escapeHtml(prio.reasons.join(' · '))}
      </div>
      <label>Vendor / technician (optional)</label><input id="p_vendor" type="text">
      <label>Cost (optional)</label><input id="p_cost" type="number" min="0" inputmode="decimal">
      <label>Details</label><textarea id="p_note" placeholder="What was wrong / what was done?"></textarea>`,
    transfer: () => `
      <div class="ticket-meta" style="background:var(--bg);border-radius:var(--radius-sm);padding:11px 13px;margin:0 0 4px;line-height:1.7;">
        <b>From</b><br>Location: ${escapeHtml(a.locationName||'—')}<br>Person: ${escapeHtml(a.assignedTo||'Unassigned')}
      </div>
      <label>To location</label><select id="p_loc">${locations.map(l=>`<option value="${l.id}" ${l.id===a.locationId?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>
      <label>To person (leave empty for unassigned)</label><input id="p_person" type="text" value="${escapeHtml(a.assignedTo||'')}">
      <label>Note</label><textarea id="p_note" placeholder="Reason for transfer"></textarea>`,
    edit: () => `<label>Asset name</label><input id="e_name" type="text" value="${escapeHtml(a.name||'')}">
      <label>Type</label><select id="e_type">${(ASSET_TYPES.includes(a.type) ? ASSET_TYPES : [a.type, ...ASSET_TYPES]).map(t=>`<option value="${escapeHtml(t)}" ${t===a.type?'selected':''}>${escapeHtml(t)}</option>`).join('')}</select>
      <label>Serial / asset tag</label><input id="e_serial" type="text" value="${escapeHtml(a.serial||'')}">
      <label>Brand / model</label><input id="e_model" type="text" value="${escapeHtml(a.model||'')}">
      <div class="two" style="gap:12px;">
        <div><label>Purchase date</label><input id="e_pdate" type="date" value="${escapeHtml(a.purchaseDate||'')}"></div>
        <div><label>Warranty until</label><input id="e_warr" type="date" value="${escapeHtml(a.warrantyUntil||'')}"></div>
      </div>
      <label>Notes</label><textarea id="e_notes" style="min-height:64px;">${escapeHtml(a.notes||'')}</textarea>
      <label>Reason for change (optional)</label><textarea id="p_note" style="min-height:52px;"></textarea>`,
    condition: () => `<label>Condition</label><select id="p_cond">${CONDITIONS.map(c=>`<option value="${c}" ${c===cond?'selected':''}>${c}</option>`).join('')}</select>
      <label>Note</label><textarea id="p_note" placeholder="e.g. cracked screen, battery weak"></textarea>`
  };
  if ($('adminOut')) $('adminOut').onclick = () => { SESSION = null; storeSession(null); renderAssetPage(id); };
  if ($('adminIn')) $('adminIn').onclick = () => {
    app.querySelectorAll('.acts button').forEach(x => x.classList.remove('on'));
    $('panel').innerHTML = `<div class="card"><h2 class="ct">Admin sign-in</h2>
      <label>Username</label><input id="s_user" type="text" autocomplete="username">
      <label>Password</label><input id="s_pw" type="password" autocomplete="current-password">
      <button class="btn-primary" id="s_go">Sign in</button><div id="s_msg" class="ticket-meta" style="margin-top:10px;"></div></div>`;
    const err = t => { $('s_msg').style.color = 'var(--danger)'; $('s_msg').textContent = t; };
    const go = async () => {
      const user = $('s_user').value.trim(), pw = $('s_pw').value;
      if (!user || !pw) return err('Enter your admin username and password.');
      $('s_go').disabled = true;
      try {
        if (loginFails) await new Promise(res => setTimeout(res, Math.min(loginFails, 5) * 1000));
        if (await assetAdminSignIn(user, pw)) { loginFails = 0; SESSION = {role:'admin', name:'Admin'}; storeSession({role:'admin'}); await renderAssetPage(id); return; }
        loginFails++; err('Incorrect username or password.');
      } catch(e){ err(e.message || 'Something went wrong.'); }
      $('s_go').disabled = false;
    };
    $('s_go').onclick = go;
    $('panel').querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
    $('s_user').focus();
  };
  app.querySelectorAll('.acts button').forEach(b => b.onclick = () => {
    const kind = b.dataset.k;
    if (kind !== 'repair' && !isAdmin()) return;
    app.querySelectorAll('.acts button').forEach(x => x.classList.toggle('on', x === b));
    $('panel').innerHTML = `<div class="card">${forms[kind]()}
      <label>Your name</label><input id="p_by" type="text" value="${escapeHtml(lsGet('it_by')||'')}">
      <button class="btn-primary" id="p_save">Save</button><div id="p_msg" class="ticket-meta" style="margin-top:10px;"></div></div>`;
    if (kind === 'repair') {   // priority only applies when a repair is being started
      const sync = () => { $('p_prio').style.display = $('p_outcome').value === 'started' ? '' : 'none'; };
      $('p_outcome').onchange = sync; sync();
    }
    $('p_save').onclick = async () => {
      if (kind !== 'repair' && !isAdmin()) { $('p_msg').textContent = 'Only an admin can do this — please sign in.'; return; }
      const by = $('p_by').value.trim(); lsSet('it_by', by);
      const entry = {type:kind, at:Date.now(), by, note: $('p_note').value.trim()};
      const upd = {};
      if (kind === 'repair') {
        entry.outcome = $('p_outcome').value; entry.vendor = $('p_vendor').value.trim(); entry.cost = $('p_cost').value;
        if (entry.outcome === 'started') { const pr = repairPriority(a, tickets); entry.priority = pr.level; entry.dueBy = pr.dueBy; }
        upd.status = entry.outcome === 'completed' ? 'Active' : 'In Repair';
      } else if (kind === 'transfer') {
        const loc = locations.find(l => l.id === $('p_loc').value);
        const person = $('p_person').value.trim();
        if (!loc || (loc.id === a.locationId && person === (a.assignedTo||''))) { $('p_msg').textContent = 'Change the location or the person to record a transfer.'; return; }
        entry.from = a.locationName || ''; entry.to = loc.name; entry.fromPerson = a.assignedTo || ''; entry.person = person;
        Object.assign(upd, {locationId: loc.id, locationName: loc.name, assignedTo: person});
      } else if (kind === 'edit') {
        const nv = {name:$('e_name').value.trim(), type:$('e_type').value, serial:$('e_serial').value.trim(), model:$('e_model').value.trim(),
          purchaseDate:$('e_pdate').value, warrantyUntil:$('e_warr').value, notes:$('e_notes').value.trim()};
        if (!nv.name) { $('p_msg').textContent = 'Asset name is required.'; return; }
        const L = {name:'name', type:'type', serial:'serial/tag', model:'model', purchaseDate:'purchase date', warrantyUntil:'warranty', notes:'notes'};
        const changed = Object.keys(nv).filter(k => (a[k] || '') !== nv[k]);
        if (!changed.length) { $('p_msg').textContent = 'No changes to save.'; return; }
        entry.changes = changed.map(k => L[k]);
        Object.assign(upd, nv);
      } else {
        entry.from = cond; entry.to = $('p_cond').value; upd.condition = entry.to;
        if (entry.to === cond && !entry.note) { $('p_msg').textContent = 'Change the condition or add a note.'; return; }
      }
      upd.history = [...(a.history || []), entry];
      $('p_save').disabled = true; $('p_save').textContent = 'Saving…';
      try {
        await db.doc('assets/' + id).update(upd);
        const kids = descendantsOf(allA, id).map(r => r.k);
        if (kids.length && kind === 'transfer') await Promise.allSettled(kids.map(k => db.doc('assets/' + k.id).update({locationId: upd.locationId, locationName: upd.locationName, assignedTo: upd.assignedTo,
          history: [...(k.history || []), {...entry, note: 'Moved with ' + a.name + (entry.note ? ' · ' + entry.note : '')}]})));
        if (kids.length && kind === 'edit' && upd.name && upd.name !== a.name) await Promise.allSettled(kids.filter(k => (k.name || '').startsWith(a.name)).map(k => db.doc('assets/' + k.id).update({name: upd.name + k.name.slice(a.name.length)})));
        await renderAssetPage(id);
      }
      catch(e){ $('p_save').disabled = false; $('p_save').textContent = 'Save'; $('p_msg').style.color = 'var(--danger)'; $('p_msg').textContent = "Couldn't save — check your connection."; }
    };
  });
}

// ---------- helpers ----------
const REQUEST_TYPES = ["Product","Service"];
const isReq = t => t.ticketType === 'request';
function label(s){ return s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' '); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function timeAgo(ts){
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h/24) + 'd ago';
}

init();
</script>
</body>
</html>
